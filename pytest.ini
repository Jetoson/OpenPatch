[pytest]
testpaths = tests
pythonpath = .
addopts = -q --tb=short
filterwarnings =
    # Deprecations become failures.
    error::DeprecationWarning
    # Starlette's own notice about httpx2, raised by importing TestClient.
    ignore:Using .httpx. with .starlette.testclient. is deprecated
    # anyio emits this when starlette imports its backward-compatible alias.
    ignore:The anyio.abc.BlockingPortal alias is deprecated, use anyio.from_thread.BlockingPortal instead.
